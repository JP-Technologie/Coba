<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071B3F">
  <meta name="robots" content="noindex">
  <title>Page not found — Coba</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="not-found-page">
  <main class="not-found-main">
    <a href="index.html" class="logo not-found-logo" aria-label="Coba home">
      <span class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 30 30" width="30" height="30">
          <circle cx="13" cy="13" r="11" fill="#FFC72C"/>
          <circle cx="17" cy="17" r="11" fill="#1E6FEB" opacity="0.92"/>
        </svg>
      </span>
      Coba
    </a>

    <section class="not-found-card" aria-labelledby="notFoundTitle">
      <div class="not-found-code" aria-hidden="true">404</div>
      <span class="legal-kicker">Lost route</span>
      <h1 id="notFoundTitle">This page moved or doesn’t exist</h1>
      <p>The link may be outdated, or the page may still be under construction. You can return safely to a working area of the Coba demo.</p>
      <div class="not-found-actions">
        <a href="index.html" class="btn btn-primary">Back to home</a>
        <a href="login.html" class="btn btn-outline-blue">Open demo account</a>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
